name: Release Antigravity Studio Kit

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run full verification & privacy leak check
        run: python scripts/verify_kit.py
      - name: Build SHA-256 verified hot-update & source release assets
        run: |
          python scripts/build_release_assets.py \
            --version "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out-dir dist-release
      - name: Create or update GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              dist-release/kit-hot-update.json \
              dist-release/theme.css \
              dist-release/renderer.js \
              dist-release/localization_dict.json \
              dist-release/antigravity-studio-kit-*.zip \
              dist-release/SHA256SUMS \
              --clobber
          else
            gh release create "${{ github.ref_name }}" \
              dist-release/kit-hot-update.json \
              dist-release/theme.css \
              dist-release/renderer.js \
              dist-release/localization_dict.json \
              dist-release/antigravity-studio-kit-*.zip \
              dist-release/SHA256SUMS \
              --title "Antigravity Studio Kit ${{ github.ref_name }}" \
              --generate-notes
          fi
