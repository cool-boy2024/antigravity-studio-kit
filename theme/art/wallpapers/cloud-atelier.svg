    <stop offset="36%" stop-color="#93c5fd"/>
    <stop offset="72%" stop-color="#dbeafe"/>
    <stop offset="100%" stop-color="#fef3c7"/>
  </linearGradient>
  <radialGradient id="sun" cx="84%" cy="14%" r="44%">
